    <text x="310" y="650" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#17113f">OCFP Ask Me Anything: Wellness in Family Medicine</text>
    <text x="310" y="680" font-size="14" fill="#70707c">Career pathways, wellness, transition to practice, and physician Q&amp;A.</text>
