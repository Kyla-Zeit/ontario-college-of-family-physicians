    <line x1="72" y1="498" x2="1128" y2="498" stroke="#dedde5"/>

    <text x="72" y="546" font-size="11" font-weight="700" letter-spacing="1.1" fill="#38aeb7">SAT · AUG 22 · 8:00 AM EDT</text>
    <text x="310" y="542" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#17113f">CFPC Exam Orientation Workshop</text>
    <text x="310" y="572" font-size="14" fill="#70707c">An introduction to certification-exam components for residents.</text>
    <rect x="974" y="522" width="114" height="32" rx="16" fill="#f5e4f0"/>
    <text x="1031" y="543" text-anchor="middle" font-size="11" font-weight="700" fill="#8a205f">FOR RESIDENTS</text>
