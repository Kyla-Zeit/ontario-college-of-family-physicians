<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OCFP events redesign preview</title>
  <desc id="desc">Source-faithful portfolio visualization of the OCFP events listing page.</desc>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="72" y="88" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.7" fill="#38aeb7">UPCOMING EVENTS</text>
