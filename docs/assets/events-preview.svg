  <text x="72" y="224" font-family="Georgia,serif" font-size="56" font-weight="700" fill="#17113f">Mainpro+ certified events.</text>

  <g font-family="Inter,Arial,sans-serif">
    <line x1="72" y1="282" x2="1128" y2="282" stroke="#dedde5"/>
    <text x="72" y="330" font-size="11" font-weight="700" letter-spacing="1.1" fill="#38aeb7">WED · JUL 15 · 9:00 AM EDT</text>
    <text x="310" y="326" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#17113f">Osteoporosis and Fracture Prevention Workshop</text>
    <text x="310" y="356" font-size="14" fill="#70707c">Updated clinical-practice guidance for prevention and management.</text>
    <rect x="964" y="306" width="124" height="32" rx="16" fill="#dff5f3"/>
    <text x="1026" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#17113f">MAINPRO+ 3.0</text>
    <text x="1110" y="332" font-size="25" fill="#38aeb7">→</text>
    <line x1="72" y1="390" x2="1128" y2="390" stroke="#dedde5"/>

    <text x="72" y="438" font-size="11" font-weight="700" letter-spacing="1.1" fill="#38aeb7">WED · JUL 22 · 8:00 AM EDT</text>
    <text x="310" y="434" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#17113f">ADHD in Primary Care: Meeting Growing Demand</text>
    <text x="310" y="464" font-size="14" fill="#70707c">Practical tools for assessment, diagnosis, and ongoing primary-care support.</text>
    <rect x="964" y="414" width="124" height="32" rx="16" fill="#dff5f3"/>
    <text x="1026" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#17113f">MAINPRO+ 1.5</text>
